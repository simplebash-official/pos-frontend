<!doctype html>
<html lang="en">
  <head>
    <script>
      // keep in sync with getInitialColorScheme() in src/store/slices/themeSlice.ts
      // and the light/dark/system <-> 'auto' mapping in src/store/colorSchemeManager.ts
      (function () {
        var key = 'pos-color-scheme';
        var stored = localStorage.getItem(key);
        var scheme =
          stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'light';
        var resolved =
          scheme === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : scheme;
        document.documentElement.setAttribute('data-mantine-color-scheme', resolved);
      })();
    </script>
    <script src="/webview-diagnostics.js"></script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#F5F5F7" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_NAME%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
