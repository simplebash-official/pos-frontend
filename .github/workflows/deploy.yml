name: Build and Deploy Frontend

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jana2u-pos-system/jana2u-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next version from conventional commits
        id: compute
        run: bash scripts/ci/next-version.sh

      - name: Bump version, commit and tag on main
        if: steps.compute.outputs.release == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/ci/set-version.mjs "${{ steps.compute.outputs.version }}"
          git add package.json
          git commit -m "chore(release): ${{ steps.compute.outputs.tag }} [skip ci]"
          git tag -a "${{ steps.compute.outputs.tag }}" -m "Jana2U POS web ${{ steps.compute.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.compute.outputs.tag }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VITE_API_BASE_URL=https://jana2u-api.duckdns.org/api
            VITE_GIT_SHA=${{ github.sha }}
            VITE_APP_VERSION=${{ steps.compute.outputs.version }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/jana2u
            
            # Pull the latest frontend image
            docker compose pull frontend
            
            # Recreate the frontend container
            docker compose up -d frontend
            
            # Clean up old images
            docker image prune -f