server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for text and asset types
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_comp_level 6;

    server_tokens off;

    # Standard security headers. nginx drops every server-level `add_header`
    # inside a location that sets its own, so each location below that adds
    # a Cache-Control header repeats this block — keep them in sync.
    # `frame-ancestors` (enforced) is the CSP equivalent of X-Frame-Options.
    # The full policy is REPORT-ONLY for now: browsers log violations in the
    # console without blocking. Once a production session shows none, rename
    # the header to `Content-Security-Policy` (all four copies). The sha256
    # is the inline theme script in index.html — src/__tests__/csp.test.ts
    # fails if that script changes without this hash being updated.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-4GM007vXG25GNJJ529skOqBFlXLsMdZCfIt1c6xn8j4=' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' https:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # SPA routing: fallback all non-file routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed static assets - immutable cache (1 year)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-4GM007vXG25GNJJ529skOqBFlXLsMdZCfIt1c6xn8j4=' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' https:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        access_log off;
    }

    # nginx's stock mime.types maps application/javascript only to .js, not
    # .mjs — an .mjs falls through to default_type application/octet-stream,
    # which browsers reject for a module worker (breaks the PDF.js worker
    # used by the invoice/receipt viewer). Force the correct type here.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-4GM007vXG25GNJJ529skOqBFlXLsMdZCfIt1c6xn8j4=' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' https:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Never cache index.html, the service worker/manifest files, or the build
    # identity file — all must reflect a fresh deploy immediately.
    location ~* (index\.html|sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest|version\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-4GM007vXG25GNJJ529skOqBFlXLsMdZCfIt1c6xn8j4=' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' https:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
