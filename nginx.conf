server {
    listen 8081;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for text and asset types
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_comp_level 6;

    # Standard security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA routing: fallback all non-file routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed static assets - immutable cache (1 year)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # nginx's stock mime.types maps application/javascript only to .js, not
    # .mjs — an .mjs falls through to default_type application/octet-stream,
    # which browsers reject for a module worker (breaks the PDF.js worker
    # used by the invoice/receipt viewer). Force the correct type here.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html or service worker/manifest files to ensure immediate updates
    location ~* (index\.html|sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
